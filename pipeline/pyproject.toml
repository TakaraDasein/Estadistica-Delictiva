[project]
name = "observatorio-pipeline"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "pyarrow==26.0.0",
    "python-calamine==0.9.0",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "statsmodels==0.15.0",
    "xlrd==2.0.1",
]

[build-system]
requires = ["uv_build==0.12.4"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "obs"
